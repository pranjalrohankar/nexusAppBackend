server.port=${PORT:8080}
server.address=0.0.0.0

# PostgreSQL - Supabase or Render PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.khvitvsltqxyurrsvdtl}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ruchitajadhav27}
spring.datasource.driver-class-name=org.postgresql.Driver

## HikariCP - limit pool size for Supabase free tier
#spring.datasource.hikari.maximum-pool-size=5
#spring.datasource.hikari.minimum-idle=2

# HikariCP - optimized for cloud PostgreSQL
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000

# HTTP Compression for fast responses
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=512

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false

# SQL Migration (runs before JPA/Hibernate)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:migration.sql
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# JWT
nexus.jwt.secret=NexusCorpTrainingCenterSecretKey2026SuperSecureKey
